iamRoleStatements:
  - Effect: "Allow"
    Action:
      - sns:Publish
    Resource:
      - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${self:custom.stageName}-mailer-bounce'
      - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${self:custom.stageName}-mailer'
  - Effect: Allow
    Action:
      - dynamodb:PutItem
      - dynamodb:GetItem
      - dynamodb:Query
    Resource:
      - !GetAtt LambdaMailerTable.Arn
      - !Sub '${LambdaMailerTable.Arn}/index/*'
      - !GetAtt ForwarderMappingTable.Arn
      - !Sub '${ForwarderMappingTable.Arn}/index/*'
  - Effect: Allow
    Action:
      - ses:SendEmail
      - ses:SendRawEmail
    Resource:
      - "*"

#  - Effect: Allow
#    Action:
#      - sqs:SendMessageBatch
#      - sqs:SendMessage
#    Resource:
#      - !ImportValue '${self:custom.stageName}-dead-letter-queue-arn'
  - Effect: Allow
    Action:
      - s3:GetObject
    Resource:
      - !Sub '${ForwarderS3Bucket.Arn}/*'
      - !GetAtt ForwarderS3Bucket.Arn
  - Effect: Allow
    Action:
      - s3:PutObject
      - s3:GetObject
    Resource:
      - !Sub '${MailerAttachments.Arn}/*'
      - !GetAtt MailerAttachments.Arn

environment:
  REPORT_EXCEPTION: true
  STAGE_NAME: ${self:custom.stageName}
  LOG_LEVEL: DEBUG
  APP_NAME: ${self:service}
  ATTACHMENT_BUCKET: !Ref MailerAttachments

  # The error topic is part of the bootstrap infrastructure for uServerless

custom:
  stageName: ${opt:stage, self:provider.stage}
